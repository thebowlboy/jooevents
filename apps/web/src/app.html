<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f5" />
    <link rel="icon" href="/bowlboy.ico" sizes="32x32" />
    <!-- The canvas is painted before any stylesheet resolves, so a hard reload
         opens on the application's own ground rather than flashing white and then
         settling. Mirrors --je-palette-cream-50 and the theme-color above; the
         application declares color-scheme: light, so there is no dark variant to
         miss. -->
    <style>
      html {
        background: #faf8f5;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
